version: 2
updates:
  - package-ecosystem: npm
    directory: /web/with-react-nextjs/para-modal-rootstock
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      para-sdk:
        patterns:
          - "@getpara/*"
      dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@getpara/*"
